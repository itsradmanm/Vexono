name: Vexono Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Vexono-latest.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || 'v2.1.0' }}
          name: "Release ${{ github.ref_name || 'v2.1.0' }} — Vexono Android"
          body: |
            ## 🌙 نسخه جدید اپلیکیشن تقویم هوشمند وکسونو (Vexono v2.1.0)
            
            فایل نصبی نسخه جدید جهت دانلود مستقیم و نصب آماده است.
            
            ### 📥 دانلود فایل نصبی:
            - **دانلود مستقیم:** `Vexono-latest.apk`
            - **نسخه اشکال‌زدایی:** `app-debug.apk`
            
            ### ✨ تغییرات و ویژگی‌های نسخه جدید:
            - 🎨 **بازطراحی کامل رابط کاربری با سیستم Glassmorphism 2.0:** تطبیق داینامیک کامل با تم روشن و تاریک بدون هیچ رنگ هاردکد
            - 🗓️ **اصلاح کامل چرخ و پیکرهای تاریخ:** سینک اسکرول چرخ سال شمسی و چینش بهینه ماه و روز
            - 📱 **پک کامل ویجت‌های حرفه‌ای سامسونگ (Samsung-Style):**
              - ویجت نواری ۲×۱ مینیمال تاریخ و مناسبت
              - ویجت مربعی ۲×۲ با ساعت، تاریخ و خلاصه رویداد
              - ویجت ۴×۲ دستور کار (Agenda) با نمایش تسک‌ها و رویدادها
              - ویجت ۴×۳ تعاملی ماهانه با تقویم کامل
            - 🔔 **سرویس نوتیفیکیشن دائم تقویم در نوار وضعیت:** نمایش پیوسته تاریخ امروز با به‌روزرسانی هوشمند سر نیمه‌شب
            - ⚡ **سازگاری کامل با اندروید ۱۴ و ۱۵ (Target SDK 35):** پشتیبانی از Insets لبه‌به‌لبه (Edge-to-Edge)، هندلینگ مجوز نوتیفیکیشن در زمان اجرا و دکمه بازگشت سیستم
            - 🗄️ **ارتقای ایمن دیتابیس Room:** ساختار دیتابیس V2 با قابلیت دسته‌بندی تسک‌ها و پشتیبانی از مایگریشن خودکار
          files: |
            Vexono-latest.apk
            app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
