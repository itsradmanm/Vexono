name: Vexono Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Vexono-latest.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || 'v1.0.0' }}
          name: "Release ${{ github.ref_name || 'v1.0.0' }} — Vexono Android"
          body: |
            ## 🌙 اپلیکیشن تقویم هوشمند Vexono
            
            فایل خروجی نسخه اندروید جهت دانلود مستقیم و نصب آماده است.
            
            ### 📥 دانلود فایل نصبی:
            - **دانلود فایل مستقیم:** `Vexono-latest.apk`
            
            ### ✨ تغییرات و ویژگی‌ها:
            - تقویم سه‌گانه شمسی، میلادی و قمری
            - دیتابیس مناسبت‌های ۱۰ ساله (۱۳۹۴ تا ۱۴۰۶+)
            - سیستم یادآور رویدادها و وظایف روزانه (To-Do)
            - ویجت اختصاصی صفحه اصلی (AppWidget)
            - تم مدرن تاریک نئونی و روشن
          files: |
            Vexono-latest.apk
            app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
