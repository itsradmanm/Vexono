name: Vexono Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Vexono-latest.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || 'v2.2.1' }}
          name: "Release ${{ github.ref_name || 'v2.2.1' }} — Vexono Android"
          body: |
            ## 🌙 نسخه جدید اپلیکیشن تقویم هوشمند وکسونو (Vexono v2.2.1)
            
            رفع قطعی و تضمینی باگ اضافه نشدن ویجت‌ها (Couldn't add widget):
            
            ### 🔧 رفع باگ‌ها و ارتقای فنی:
            - 🛠️ **حل مشکل سازگاری با لانچرهای اندروید (MIUI / HyperOS / One UI):** جایگزینی کلیه تگ‌های غیرمجاز با FrameLayout و ImageView مورد تأیید RemoteViews جهت جلوگیری از خطای InflateException
            - 🎯 **بهینه‌سازی هایلایت روز جاری در تقویم ماه:** حذف کامل فراخوانی‌های پرخطر رفلکشن و استفاده از مکانیزم بومی RemoteViews
            - 📱 **عملکرد کاملاً روان و بی‌نقص هر ۵ ویجت:**
              - ۲×۱ کپسولی امروز
              - ۲×۲ مینیمال امروز
              - ۲×۲ گرید تقویم ماه
              - ۴×۲ ماه و برنامه روزانه
              - ۴×۲ رویدادهای پیش‌رو
            
            ### 📥 دانلود مستقیم:
            - **دانلود فایل نصبی:** `Vexono-latest.apk`
            - **فایل دیباگ:** `app-debug.apk`
          files: |
            Vexono-latest.apk
            app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
