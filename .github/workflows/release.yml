name: Vexono Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Vexono-latest.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || 'v2.2.0' }}
          name: "Release ${{ github.ref_name || 'v2.2.0' }} — Vexono Android"
          body: |
            ## 🌙 نسخه جدید اپلیکیشن تقویم هوشمند وکسونو (Vexono v2.2.0)
            
            پک کامل ویجت‌های فوق‌حرفه‌ای و مدرن با الهام مستقیم از طراحی Samsung One UI:
            
            ### 📱 ویجت‌های جدید به سبک سامسونگ (Samsung One UI):
            - 💊 **ویجت ۲×۱ امروز (Pill):** طراحی کپسولی شیک با دایره تاریخ، ماه برجسته و روز هفته با رنگ آبی One UI
            - 🔲 **ویجت ۲×۲ امروز مینیمال (Square):** تاریخ بزرگ ۵۴sp، ماه و سال در بالا و روز هفته آبی در گوشه
            - 🗓️ **ویجت ۲×۲ تقویم ماه (Month Grid):** نام ماه در مرکز، ردیف ش ی د س چ پ ج با جمعه قرمز و دایره سفید برای روز جاری
            - 📋 **ویجت ۴×۲ ماه و برنامه (Month + Agenda):** گرید تقویم ماهانه در چپ + تاریخ، دکمه (+) افزودن رویداد و لیست برنامه‌ها در راست
            - 📝 **ویجت ۴×۲ رویدادهای پیش‌رو (Upcoming Events):** لیست وظایف و رویدادها با خطوط نشانگر عمودی رنگی (سبز، آبی، نارنجی) و ایموجی‌ها
            
            ### 📥 دانلود فایل نصبی:
            - **دانلود مستقیم:** `Vexono-latest.apk`
            - **نسخه اشکال‌زدایی:** `app-debug.apk`
          files: |
            Vexono-latest.apk
            app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
