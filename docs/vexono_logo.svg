<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#241E38"/>
      <stop offset="100%" stop-color="#0F0F14"/>
    </radialGradient>
    
    <!-- Primary Brand Gradient (Violet to Cyan) -->
    <linearGradient id="vexonoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C4DFF"/>
      <stop offset="100%" stop-color="#00E5C7"/>
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#333348" stroke-width="3"/>

  <!-- Calendar Base Card -->
  <rect x="116" y="130" width="280" height="260" rx="36" fill="#1B1B24" stroke="#2E2E3E" stroke-width="4"/>

  <!-- Calendar Header Strip -->
  <path d="M116 166 C116 146.1 132.1 130 152 130 L360 130 C379.9 130 396 146.1 396 166 L396 186 L116 186 Z" fill="url(#vexonoGradient)"/>

  <!-- Hanging Rings -->
  <rect x="170" y="110" width="24" height="42" rx="12" fill="#00E5C7"/>
  <rect x="318" y="110" width="24" height="42" rx="12" fill="#7C4DFF"/>

  <!-- Stylized Minimalist Folded 'V' Symbol -->
  <path d="M186 244 L256 326 L326 244" fill="none" stroke="url(#vexonoGradient)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)"/>

  <!-- Small Accent Dot (Day Indicator) -->
  <circle cx="256" cy="360" r="8" fill="#00E5C7"/>
</svg>
